# Tinfoil Container Configuration
# For updates: edit this file, commit, run the workflow (e.g., v0.0.2)
cvm-version: 0.14.7
cpus: 2
memory: 8192

containers:
  - name: "hitch-aggregator"
    image: "ghcr.io/carsonbrown96/hitch-aggregator@sha256:aa471f58e51c9d64774386c6fd1377c33acfd257ce9d069a4233be9b34cddcc2"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/attest')"]
      interval: 10s
      timeout: 5s
      retries: 6

shim:
  upstream-port: 8080
  paths:
    - /*
